<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS World - Poops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --psw-primary: #00ff00; --psw-secondary: #00ffff; --dark-bg: rgba(5, 5, 5, 0.95); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; background: #000; color: #fff; font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; direction: rtl; overflow: hidden; }
  body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0, 255, 0, 0.1) 0%, rgba(0, 255, 255, 0.1) 100%); z-index: 0; }
  .hud-container { position: relative; z-index: 1; width: 95%; max-width: 900px; background: var(--dark-bg); border-top: 4px solid var(--psw-primary); border-bottom: 4px solid var(--psw-secondary); border-radius: 15px; padding: 40px 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 20px rgba(0, 255, 0, 0.2); }
  .brand-title { font-family: 'Orbitron', sans-serif; font-size: 5rem; font-weight: 900; text-align: center; margin-bottom: -5px; letter-spacing: 2px; direction: ltr; color: var(--psw-primary); text-shadow: 0 0 15px rgba(0, 255, 0, 0.6); }
  .brand-sub { font-size: 1.8rem; text-align: center; color: var(--psw-secondary); font-weight: 900; letter-spacing: 2px; margin-bottom: 25px; font-family: 'Cairo', sans-serif; text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
  
  .contact-info { text-align: center; font-size: 1.1rem; color: #d0d0d0; margin-bottom: 25px; direction: rtl; line-height: 1.8; border-radius: 8px; padding: 15px; background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.05), rgba(0, 255, 0, 0.05), transparent); border-top: 1px dashed var(--psw-secondary); border-bottom: 1px dashed var(--psw-primary); }
  .contact-info span { color: var(--psw-primary); font-weight: 900; margin-left: 5px; }
  .contact-info .phones { direction: ltr; display: inline-block; font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: var(--psw-secondary); text-shadow: 0 0 5px rgba(0, 255, 255, 0.5); font-weight: bold; }

  .status-panel { background: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 8px; border: 1px solid #333; border-right: 5px solid var(--psw-primary); border-left: 5px solid var(--psw-secondary); margin-bottom: 20px; position: relative; }
  .status-panel::before { content: 'EXECUTION'; position: absolute; top: -12px; left: 15px; background: var(--psw-primary); color: #000; padding: 2px 10px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border-radius: 4px; }
  #state { font-size: 24px; font-weight: 900; color: #fff; text-align: center; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
  .loader-wrapper { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .dot { width: 12px; height: 12px; background: var(--psw-primary); border-radius: 50%; box-shadow: 0 0 10px var(--psw-primary); animation: bounce 0.8s infinite alternate; }
  .dot:nth-child(2) { background: var(--psw-secondary); box-shadow: 0 0 10px var(--psw-secondary); animation-delay: 0.2s; } 
  .dot:nth-child(3) { background: #fff; box-shadow: 0 0 10px #fff; animation-delay: 0.4s; }
  @keyframes bounce { to { transform: translateY(-10px); opacity: 0.5; } }
  #out-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
  #out { white-space: pre-wrap; font: 12px/1.45 Consolas, monospace; background: rgba(0, 0, 5, 0.8); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 8px; padding: 14px; max-height: 250px; overflow-y: auto; color: #bbb; direction: ltr; text-align: left; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
  .done { color: var(--psw-secondary) !important; text-shadow: 0 0 10px var(--psw-secondary) !important; } .error { color: var(--psw-primary) !important; text-shadow: 0 0 10px var(--psw-primary) !important; }
  .footer-sys { position: fixed; bottom: 10px; right: 20px; font-family: 'Orbitron', sans-serif; font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 2px; z-index: 2; direction: ltr; }
  @media (max-width: 600px) { .brand-title { font-size: 3.5rem; } .brand-sub { font-size: 1.4rem; } .contact-info { font-size: 0.95rem; } .contact-info .phones { font-size: 1.1rem; } #out { min-height: 100px; max-height: 200px; } }
</style>
</head>
<body>
<div class="hud-container">
  <h1 class="brand-title">PS World</h1>
  <div class="brand-sub">POOPS EXPLOIT</div>
  
  <div class="contact-info">
    <div><span>📍 العنوان:</span> ٢٥٢ ش شبرا أمام محطه الخلفاوي</div>
    <div><span>📞 للتواصل:</span> <div class="phones">01220543390 / 01004760468</div></div>
  </div>

  <div class="status-panel"><div id="state"><span id="stateText">جارٍ تحميل سلسلة Poops<br><small>Please Wait...</small></span><div class="loader-wrapper"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></div>
  <div id="out-container"><div id="out"></div></div>
</div>
<div class="footer-sys">PS WORLD v12.0 - Poops</div>
<script type="module">
import "./chain_poops.js";
const state = document.getElementById("state"), stateText = document.getElementById("stateText");
window.poopsDone = function () { state.classList.add("done"); stateText.innerHTML = "اكتملت العملية بنجاح<br><small>EXPLOIT SUCCESSFUL</small>"; document.querySelector('.loader-wrapper').style.display = 'none'; };
window.poopsError = function () { state.classList.add("error"); stateText.innerHTML = "حدث خطأ أثناء التنفيذ<br><small>EXPLOIT FAILED</small>"; document.querySelector('.loader-wrapper').style.display = 'none'; };
</script>
</body>
</html>
